<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Conocé la galería de Honeymoon y descubrí prendas y accesorios kawaii inspirados en Hello Kitty.">

    <title>Honeymoon - Galería</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="./scss/style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            <a href="index.html">
                <img src="./img/logo.png" alt="Logo de Honeymoon">
            </a>
        </div>

        <nav class="navbar" aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="galeria.html">Galería</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <section class="encabezado-galeria">

            <span>Inspiración kawaii 🎀</span>

            <h1>Nuestra galería</h1>

            <p>
                Descubrí algunos de nuestros looks, prendas y accesorios
                favoritos de la colección Honeymoon.
            </p>

        </section>

        <section class="galeria-grid">

            <figure class="galeria-item">
                <img src="./img/Buzo2.jfif"
                    alt="Buzo negro inspirado en Hello Kitty"
                    loading="lazy">
                <figcaption>Buzo Kitty</figcaption>
            </figure>

            <figure class="galeria-item">
                <img src="./img/cartera.jpg"
                    alt="Cartera blanca con diseño de Hello Kitty"
                    loading="lazy">
                <figcaption>Cartera Sweet</figcaption>
            </figure>

            <figure class="galeria-item">
                <img src="./img/conjunto blanco.webp"
                    alt="Conjunto blanco con estampado kawaii"
                    loading="lazy">
                <figcaption>Conjunto White</figcaption>
            </figure>

            <figure class="galeria-item">
                <img src="./img/conjunto.jpg"
                    alt="Conjunto rosa de estilo kawaii"
                    loading="lazy">
                <figcaption>Conjunto Pink</figcaption>
            </figure>

            <figure class="galeria-item">
                <img src="./img/imagen.webp"
                    alt="Remera rosa de Hello Kitty"
                    loading="lazy">
                <figcaption>Remera Lovely</figcaption>
            </figure>

            <figure class="galeria-item">
                <img src="./img/mochila.jfif"
                    alt="Mochila de estilo kawaii"
                    loading="lazy">
                <figcaption>Mochila Kitty</figcaption>
            </figure>

            <figure class="galeria-item">
                <img src="./img/pantalon.jfif"
                    alt="Pantalón rosa con estampado de Hello Kitty"
                    loading="lazy">
                <figcaption>Pantalón Sweet</figcaption>
            </figure>

            <figure class="galeria-item">
                <img src="./img/remera.webp"
                    alt="Remera blanca con diseño kawaii"
                    loading="lazy">
                <figcaption>Remera White</figcaption>
            </figure>

            <figure class="galeria-item">
                <img src="./img/vestido.webp"
                    alt="Vestido gris inspirado en Hello Kitty"
                    loading="lazy">
                <figcaption>Vestido Kitty</figcaption>
            </figure>

        </section>

    </main>

    <footer>
        <p>© 2026 Honeymoon | Todos los derechos reservados.</p>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
